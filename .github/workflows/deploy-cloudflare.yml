name: Deploy to Cloudflare Pages

# Builds the Next static export (out/) and deploys it to Cloudflare Pages.
#
# Triggers:
#   - push to main: ship code changes.
#   - workflow_dispatch: manual deploy from the Actions tab.
#   - repository_dispatch (refresh-conditions): the hourly refresh. An external
#     scheduler (cron-job.org) POSTs /dispatches with
#     {"event_type":"refresh-conditions"} once an hour, which rebuilds so the
#     all-sites conditions feed (public/api/v1/, generated in prebuild) refreshes
#     and the month's awareness observance (lib/observances.ts) rolls over. We use
#     an external ping rather than GitHub's own `schedule:` because scheduled
#     workflows are frequently delayed or skipped; cron-job.org fires on time.
#     Public repo ⇒ unlimited Actions minutes; the deploy is a direct wrangler
#     upload, which isn't counted against Pages' build limit — so hourly is free.
#   NOTE: a dispatch trigger only fires once this file is on the default branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-conditions]

# One in-flight deploy at a time; a newer build supersedes an older one.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install + build static export
        # prebuild → scripts/gen-conditions.ts fetches one batched Open-Meteo request and writes
        # public/conditions.json, which the build copies into out/ and Pages serves as a static
        # asset. Best-effort: a provider hiccup writes an empty feed rather than failing the build.
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Upload the built static site (out/). public/_headers is copied into
          # out/ and applied by Pages automatically.
          #
          # `--branch=main` forces a PRODUCTION deployment (main is the project's
          # production branch) — the custom domain serves production, so an
          # implicit/preview branch would deploy but never go live.
          command: pages deploy out --project-name=fusionspace-window --branch=main
