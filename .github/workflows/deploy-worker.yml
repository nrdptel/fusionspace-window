name: Deploy conditions Worker

# Deploys the scheduled "all sites" conditions feed Worker (workers/conditions) to Cloudflare.
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the Pages deploy — the
# token needs Workers Scripts:Edit and Workers KV Storage:Edit permissions (see docs).
#
# Manual-only until the one-time setup is done (a real KV namespace id in wrangler.jsonc + the
# token's Workers/KV scopes — see workers/conditions/README.md). Run it from the Actions tab once
# configured. To auto-deploy on every change afterwards, add a `push` trigger with a paths filter
# for workers/conditions/** and the shared lib files it bundles.
on:
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/conditions
          command: deploy
